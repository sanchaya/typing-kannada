<style>

.bubbles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bub{border:0;border-radius:50%;background:#0e7490;color:#fff;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.05;padding:2px;text-align:center}.bub small{font-weight:400;opacity:.85}

.grid9{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:120px}.grid9 i{height:9px;border-radius:2px;background:var(--line);display:block}.grid9 i.on{background:var(--fg)}.grid9 i.now{background:var(--accent)}

.slide{justify-content:flex-start;gap:0}

function proj(o){var W=o.w,H=o.h;return {x:function(lo){return (lo-o.x0)/(o.x1-o.x0)*W},y:function(la){return (o.y1-la)/(o.y1-o.y0)*H}}}

 Object.keys(POS).filter(function(k){return CC[k]}).sort(function(a,b){return CC[b].length-CC[a].length}).forEach(function(k){h+=bub(pr,POS[k],CC[k].length,'data-cc',k,k==='India'?' o':'',4,k==='India'?1.6:3,CC[k].length>=2&&k!=='United Kingdom'&&k!=='France'&&k!=='Germany'&&k!=='Norway'&&k!=='Lithuania'&&k!=='Croatia')});return h+'</svg>'}

 ['United Kingdom','France','Germany','Norway','Lithuania','Croatia'].filter(function(k){return CC[k]}).forEach(function(k){h+=bub(pr,POS[k],CC[k].length,'data-cc',k,'',5,4,true)});return h+'</svg>'}

 var n=S.length,F=S.filter(function(o){return o.first}),R=S.filter(function(o){return !o.first}),W=S.filter(function(o){return o.g==='f'}).length,M=S.filter(function(o){return o.g==='m'}).length,out=[];

 function tiles(a){return '<div class="tiles">'+a.map(function(t){return '<div class="tile"><b>'+t[0]+'</b><span>'+t[1]+'</span></div>'}).join('')+'</div>'}
 function head(big,color,h,t){return '<div class="hd"><p class="big" style="color:'+color+'">'+big+'</p><div><h2>'+h+'</h2><p class="t">'+t+'</p></div></div>'}
 var TH={},TF={},TW={},TM={};S.forEach(function(o){TH[o.t]=(TH[o.t]||0)+1;if(o.first)TF[o.t]=(TF[o.t]||0)+1;if(o.g==='f')TW[o.t]=(TW[o.t]||0)+1;if(o.g==='m')TM[o.t]=(TM[o.t]||0)+1});
 var thF=Object.keys(TF).sort(function(a,b){return TF[b]-TF[a]}).slice(0,5);
 var thW=Object.keys(TH).filter(function(k){return (TW[k]||0)+(TM[k]||0)>=5}).sort(function(a,b){return (TW[b]||0)/((TW[b]||0)+(TM[b]||0))-(TW[a]||0)/((TW[a]||0)+(TM[a]||0))}).slice(0,5);
 var Ff=F.filter(function(o){return o.g==='f'}).length,Fm=F.filter(function(o){return o.g==='m'}).length;
 var dots=S.slice().sort(function(a,b){return a.first-b.first||a.n.localeCompare(b.n)}).map(function(o){return '<i class="'+(o.first?'n':'')+'" title="'+esc(o.n)+'"></i>'}).join('');
 /* 1 new voices */
 out.push('<div class="slide">'+head(F.length,'var(--accent)','speakers are new to BLF',pct(F.length,n)+'% of the '+n+' announced. One square per speaker.')+'<div class="two sec"><div><div class="waffle">'+dots+'</div><div class="legend"><button data-go="nw"><i style="background:var(--accent)"></i>First-time ('+F.length+')</button><button data-go="ret"><i style="background:var(--fg)"></i>Returning ('+R.length+')</button></div></div><div class="opt"><h5>Where the newcomers sit, by theme</h5>'+thF.map(function(k){return hb(k,TF[k],TF[thF[0]],'var(--accent)','','')}).join('')+'</div></div>'+tiles([[pct(Ff,Ff+Fm)+'%','of first-timers who are women'],[pct(Fm,Ff+Fm)+'%','are men'],[S.filter(function(o){return ed(o).length>=3}).length,'speakers back for the 3rd+ time'],[S.filter(function(o){return o.first&&o.p}).length,'ranked picks seen for the first time']])+'</div>');
 /* 2 gender */
 function gbar(lab,a){var f=a.filter(function(o){return o.g==='f'}).length,m=a.filter(function(o){return o.g==='m'}).length,u=a.length-f-m,t=a.length;return '<div class="gr"><div>'+lab+'</div><div class="tr" title="'+f+' women, '+m+' men, '+u+' not stated"><b style="width:'+pct(f,t)+'%;background:var(--f)">'+pct(f,t)+'%</b><b style="width:'+pct(m,t)+'%;background:var(--m)">'+pct(m,t)+'%</b><b style="width:'+pct(u,t)+'%;background:var(--u)"></b></div></div>'}
 out.push('<div class="slide">'+head(pct(W,W+M)+'%','var(--f)','of speakers with a stated gender are women',W+' women, '+M+' men; '+(n-W-M)+' bios have no pronouns. Read from bio text, so an indicator not a census.')+'<div class="two sec"><div class="gb">'+gbar('Everyone',S)+gbar('First-time',F)+gbar('Returning',R)+gbar('Ranked picks',S.filter(function(o){return o.p}))+gbar('Authors',S.filter(function(o){return !o.nonauth}))+gbar('Not authors',S.filter(function(o){return o.nonauth}))+'<div class="legend"><button data-go="gf"><i style="background:var(--f)"></i>Women</button><button data-go="gm"><i style="background:var(--m)"></i>Men</button><span><i style="background:var(--u)"></i>Not stated</span></div></div><div class="opt"><h5>Highest share of women, by theme</h5>'+thW.map(function(k){return hb(k,pct(TW[k]||0,(TW[k]||0)+(TM[k]||0)),100,'var(--f)','','')}).join('')+'</div></div>'+tiles([[W,'women'],[M,'men'],[n-W-M,'not stated'],[pct(S.filter(function(o){return o.g==='f'&&o.first}).length,W)+'%','of the women are first-timers']])+'</div>');
 /* 3 world */
 var CC={},CITY={};S.forEach(function(o){(CC[o.cc]=CC[o.cc]||[]).push(o.n);if(o.city)CITY[o.city]=(CITY[o.city]||0)+1});
 var nIn=(CC['India']||[]).length,nUn=(CC['Unknown']||[]).length,nOut=n-nIn-nUn,dia=S.filter(function(o){return o.dia}).length;
 var keys=Object.keys(CC).filter(function(k){return k!=='Unknown'}).sort(function(a,b){return CC[b].length-CC[a].length||a.localeCompare(b)});
 out.push('<div class="slide">'+head(nOut,'var(--accent)','speakers are based outside India',nIn+' in India ('+pct(nIn,n)+'%), '+nUn+' not placed from bios. Country is judged from each bio.')+'<div class="two sec"><div class="mapwrap">'+worldMap(CC)+'</div><div>'+keys.slice(0,7).map(function(k){return hb(k,CC[k].length,CC[keys[1]].length*3,k==='India'?'#0e7490':'var(--accent)','data-cc',k)}).join('')+'</div></div>'+tiles([[keys.length-1,'countries beyond India'],[dia,'born in India, living abroad'],[(CC['United Kingdom']||[]).length,'based in the UK'],[nUn,'not established']])+'</div>');
 /* 4 India cities */
 var ck=Object.keys(CITY).sort(function(a,b){return CITY[b]-CITY[a]}),cs=0;ck.forEach(function(k){cs+=CITY[k]});
 out.push('<div class="slide">'+head(CITY['Bengaluru']||0,'#0e7490','India-based speakers name Bengaluru','Only '+cs+' of '+nIn+' India-based bios name a city, so these are floors. Tap a bar.')+'<div class="two sec"><div class="mapwrap opt" style="max-width:340px">'+inMap(CITY)+'</div><div>'+ck.map(function(k){return hb(k,CITY[k],CITY[ck[0]],'#0e7490','data-city',k)}).join('')+'</div></div>'+tiles([[ck.length,'cities named'],[pct(CITY['Bengaluru']||0,cs)+'%','of named cities is Bengaluru'],[(CITY['Delhi / NCR']||0)+(CITY['Mumbai']||0),'Delhi and Mumbai combined'],[nIn-cs,'India-based, city not stated']])+'</div>');
 /* 5 years */
 var mx=Math.max.apply(null,YRS.map(function(y){return ST.per[y].total})),peak=YRS.slice().sort(function(a,b){return ST.per[b].total-ST.per[a].total})[0];
 out.push('<div class="slide">'+head(n,'var(--fg)','speakers in 2026, against '+ST.per[2025].total+' in 2025','Returning (dark) and new to the archive (grey; orange in 2026). Orange % below each year: share of that year\'s speakers back in 2026.')+'<div class="vc sec">'+YRS.map(function(y){var p=ST.per[y],ht=p.total/mx*100,rt=p.returning/p.total*100;return '<div><div class="v">'+p.total+'</div><div class="col" style="height:'+ht+'%"><b style="height:'+(100-rt)+'%;background:'+(y===2026?'var(--accent)':'var(--u)')+'"></b><b style="height:'+rt+'%;background:var(--fg)"></b></div><div class="y'+(y===2026?' now':'')+'">'+String(y).slice(2)+'</div><div class="y2">'+(y===2026?'':pct(p.in2026,p.total)+'%')+'</div></div>'}).join('')+'</div>'+tiles([[peak,'peak year, '+ST.per[peak].total+' speakers'],[pct(ST.per[2025].in2026,ST.per[2025].total)+'%','of 2025 speakers return in 2026'],[pct(ST.per[2025].returning,ST.per[2025].total)+'%','of 2025 had spoken before'],[pct(R.length,n)+'%','of 2026 has spoken before']])+'</div>');
 /* 6 loyalty */
 var hs=ST.hist,hm=Math.max.apply(null,Object.keys(hs).map(function(k){return hs[k]})),five=hs[5]+hs[6]+hs[7]+hs[8];
 out.push('<div class="slide">'+head(hs[0],'var(--accent)','have no speaker-page listing from 2018 to 2025','Bars: editions attended out of 8 (2018 to 2025) by this year\'s speakers.')+'<div class="two sec"><div class="vc v6">'+Object.keys(hs).map(function(k){return '<div><div class="v">'+hs[k]+'</div><div class="col" style="height:'+(hs[k]/hm*100)+'%"><b style="height:100%;background:'+(k==='0'?'var(--accent)':'var(--fg)')+'"></b></div><div class="y">'+k+'</div></div>'}).join('')+'</div><div class="opt"><h5>Most frequent speakers, 2018 to 2025</h5>'+ST.lead.slice(0,6).map(function(x){return hb(x.n,x.y.length,8,x.in26?'var(--accent)':'var(--u)','','')}).join('')+'<div class="legend"><span><i style="background:var(--accent)"></i>speaking in 2026</span></div></div></div>'+tiles([[hs[1],'one edition'],[hs[2]+hs[3]+hs[4],'two to four'],[five,'five or more'],[hs[8],'all eight']])+'<div class="legend"><button data-go="reg">See the 3+ edition regulars →</button></div></div>');
 /* 7 languages */
 var lc={};S.forEach(function(o){o.lg.forEach(function(l){lc[l]=(lc[l]||0)+1})});var lk=Object.keys(lc).sort(function(a,b){return lc[b]-lc[a]||a.localeCompare(b)});var named=S.filter(function(o){return o.lg.length}).length;
 out.push('<div class="slide">'+head(lk.length,'#0e7490','languages named in speaker bios','Only '+named+' of '+n+' bios name a language, so this undercounts. Tap a bubble or bar.')+'<div class="two sec"><div class="bubbles">'+lk.slice(0,12).map(function(l){var d=34+Math.sqrt(lc[l])*13;return '<button class="bub" style="width:'+d+'px;height:'+d+'px;font-size:'+(d>60?12:10)+'px" data-lang="'+esc(l)+'">'+esc(l)+'<small>'+lc[l]+'</small></button>'}).join('')+'</div><div class="opt">'+lk.slice(0,8).map(function(l){return hb(l,lc[l],lc[lk[0]],'#0e7490','data-lang',l)}).join('')+'</div></div>'+tiles([[named,'speakers with a named language'],[pct(named,n)+'%','of all speakers'],[S.filter(function(o){return o.lg.length>1}).length,'work across 2+ languages'],[lk[0]+' '+lc[lk[0]],'most common']])+'<p class="note"><b>Method:</b> BLF 2026 speakers page and bios, archive speaker pages (2018 to 2025) and schedules (2012 to 2025), matched by name. Gender from bio pronouns; language and country only where a bio states them. No gender history by year yet.</p></div>');
 return out}

 $('ypager').innerHTML='<button class="pbtn" data-step="-1"'+(pg.y<=0?' disabled':'')+'>‹ Prev</button><span class="dots">'+sl.map(function(_,k){return '<i class="'+(k===pg.y?'on':'')+'"></i>'}).join('')+'</span><button class="pbtn" data-step="1"'+(pg.y>=sl.length-1?' disabled':'')+'>Next ›</button>'}

 body.innerHTML=names.length?'<div class="rows" style="--rh:'+rh+'px">'+names.slice(base,base+per).map(function(o){var g='<div class="grid9">'+YRS.map(function(y){return '<i class="'+(y===2026?'now':(o.y.indexOf(y)>-1?'on':''))+'" title="'+y+'"></i>'}).join('')+'</div>';return '<div class="row nonum" style="grid-template-columns:1fr auto auto"><button class="mid" data-open="'+S.indexOf(o)+'"><span class="nm">'+esc(o.n)+'</span><span class="sl status">'+esc(status(o))+'</span></button>'+g+'<button class="star" data-rm="'+S.indexOf(o)+'" aria-label="Remove '+esc(o.n)+'">×</button></div>'}).join('')+'</div>':'<p class="empty">Nobody tracked yet. Add a name above, use a preset, or star speakers anywhere.</p>'}
